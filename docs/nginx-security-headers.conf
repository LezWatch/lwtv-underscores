# LezWatch.TV — security response headers (nginx)
#
# WHY THIS FILE EXISTS
# --------------------
# WP Rocket + rocket-nginx serve cached HTML straight from disk (see the
# x-rocket-nginx-serving-static response header). Those responses never reach
# PHP, so anything added via the `wp_headers` filter is silently absent on the
# majority of front-end page views. Static policy headers therefore have to be
# set here.
#
# Request-dependent headers stay in PHP:
#   plugins/lwtv-plugin/php/_components/class-features.php
#     -> modify_front_end_http_headers()
#   That method sets X-Frame-Options and Content-Security-Policy
#   "frame-ancestors 'self'", skipping both for oEmbed requests so embeds keep
#   working. Do NOT duplicate frame-ancestors at the `server` level: browsers
#   intersect multiple CSP headers and the most restrictive wins, which would
#   re-break the oEmbed exception.
#
# BEFORE APPLYING
# ---------------
# 1. Requires the ngx_headers_more module for `more_clear_headers`. Check with
#    `nginx -V 2>&1 | grep -o headers-more`. If it is not compiled in, delete
#    the `more_clear_headers` line and instead stop X-XSS-Protection at its
#    source (see note 3 below) — nginx cannot unset a header without it.
# 2. Confirm every subdomain is HTTPS-only before adding includeSubDomains.
#    Enumerate them, then curl each over http:// and confirm the redirect.
#    This directive is cached by browsers for a year and cannot be recalled.
#    If any subdomain (staging, mail, a legacy tool) is still served over
#    plain HTTP, that subdomain becomes unreachable for its visitors.
# 3. Find out what is currently emitting X-XSS-Protection. Likely candidates:
#    an existing nginx snippet, a security plugin (Wordfence/iThemes), or
#    WP Rocket itself. Removing it at the source is better than clearing it
#    downstream. The PHP patch also sends `X-XSS-Protection: 0` as a fallback
#    for uncached requests.
# 4. `nginx -t` then reload. Verify with:
#      curl -sI https://lezwatch.tv/ | grep -iE 'strict-transport|permissions-|referrer-|content-security|x-xss|x-frame|x-rocket'
#    Run it against both a cache HIT and a cache MISS (append a cache-busting
#    query string to force the MISS) — the two paths emit different headers.

# --- Place inside the `server` block for lezwatch.tv (the HTTPS listener) ---

# NOTE ON add_header INHERITANCE: add_header directives are NOT inherited into
# a location/if block that defines its own add_header. rocket-nginx ships its
# own location blocks with add_header directives in them. If the verification
# curl above shows these headers missing on cache HITs, move this block into an
# include and pull it into the rocket-nginx locations too, or use the
# `always` flag plus ngx_headers_more's `more_set_headers`, which does inherit.

# HSTS. The audit found max-age=31536000 with no includeSubDomains.
# Only enable includeSubDomains after completing step 2 above.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Referrer-Policy. Replaces no-referrer-when-downgrade, which sends the full
# URL to every third-party origin over HTTPS. strict-origin-when-cross-origin
# sends only the origin cross-site, keeps full referrers same-site (so internal
# analytics still work), and sends nothing on an HTTPS->HTTP downgrade.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy. Deny the powerful features the site does not use.
# Deliberately NOT denied, because something on the site may need them:
#   - fullscreen: video embeds (YouTube/Vimeo) require it
#   - autoplay:   some embedded players use it
# An empty allowlist "()" denies the feature to the top-level document and all
# iframes. If a legitimate embed breaks, remove that one entry rather than the
# whole header, and re-test.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# Remove the dead X-XSS-Protection header. Requires ngx_headers_more.
# Prefer fixing this at the source (step 3) and deleting this line.
more_clear_headers "X-XSS-Protection";

# --- Fallback for WP Rocket static cache hits only ---
#
# PHP owns frame-ancestors so the oEmbed exception can apply. Cached responses
# skip PHP, and rocket-nginx does not cache oEmbed URLs (they carry query
# args), so asserting the policy in the static-serving location is safe and
# closes the gap. Merge these two lines into the existing rocket-nginx
# location block rather than adding a second one — check your rocket-nginx
# include for the real location name/regex, it varies by version.
#
# location ~ /wp-content/cache/ {
#     add_header X-Frame-Options "SAMEORIGIN" always;
#     add_header Content-Security-Policy "frame-ancestors 'self'" always;
# }

# --- NOT addressed here: the permissive CSP ---
#
# The live header is:
#   content-security-policy: default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
# Find and delete it. It is a no-op — it cannot restrict anything the browser
# default does not already allow — and while it is present it will be
# intersected with the frame-ancestors policy above. `default-src *` does not
# supply a frame-ancestors fallback (frame-ancestors has no fallback to
# default-src), so the intersection is fine in practice, but leaving a second
# CSP header in place makes the real policy much harder to reason about later.
# Grep for it in the nginx config, WP Rocket settings, and any security plugin.
