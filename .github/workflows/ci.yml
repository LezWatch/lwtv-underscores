name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
    # `edited` covers a changed base branch: the gitleaks range depends on the base, so a
    # retargeted PR must be re-scanned. It also fires on title/body edits; those re-run in
    # full on purpose, because a skipped job reports "skipped", which branch protection
    # counts as passing and would paper over a red check on the same commit.
    types: [opened, synchronize, reopened, edited]

# Build scripts and tests run PR code, so the token they could reach stays read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Until all pinned actions ship Node 24 runtimes, force JS actions onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      # `npm ci`, not `npm install`: it fails if package.json and package-lock.json
      # disagree instead of quietly re-resolving, so every new package lands in the
      # lockfile the risk tier checks. Its preinstall hook runs `composer install`, which
      # installs from composer.lock (and warns if composer.json has drifted from it).
      - name: Install dependencies
        run: npm ci

      - name: Composer lockfiles match manifests
        run: |
          composer validate --no-check-publish --no-check-all
          composer validate --no-check-publish --no-check-all --working-dir=plugins/lwtv-plugin

      # PHPCS (WPCS), ESLint, Stylelint.
      - name: Lint
        run: npm run lint

      - name: PHPStan
        run: composer analyse -- --no-progress --error-format=github

      - name: PHPUnit
        run: npm test

      # `npm run build` minus build:composer, which runs `composer update` and would
      # resolve new versions instead of testing the ones in the lockfile.
      # The SVG sprite URL is baked into the CSS per environment, so development builds
      # for staging and everything else for production.
      - name: Build
        env:
          SVG_SPRITE_ENV: ${{ (github.base_ref || github.ref_name) == 'development' && 'staging' || 'production' }}
        run: |
          echo "Building for $SVG_SPRITE_ENV"
          npm run build:assets
          npm run build:workspace
          npm run build:mover

      # The gate's own logic: a regression here would otherwise merge with every check
      # green. These run the PR's own code, so they live in this job, which runs PR code
      # anyway, and never in `security`: its scanners read .github/gitleaks.toml from disk, and
      # PR code running first could rewrite it.
      - name: Gate script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      # Pushes only (never PRs): this is what development.yaml / production.yaml
      # ship, once the whole CI run passes. The deploy rsync's EXCLUDE list decides what
      # reaches the server; dropping dependency and cache folders here just keeps the
      # artifact small. Hidden files are left out, as they always were.
      - name: Upload theme artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-files
          retention-days: 7
          if-no-files-found: error
          path: |
            .
            !**/node_modules/
            !vendor/
            !plugins/*/vendor/
            !_build_scripts/webpackdist/
            !_build_scripts/tmp-icons/

      - name: Upload cron artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cron-files
          retention-days: 7
          if-no-files-found: error
          path: cron/

  # Early warning for the next PHP release (issue #746). It reports but never blocks:
  # continue-on-error keeps a red result here from failing the run (so the deploy
  # workflows, which wait for a successful CI run, still go), and it is not a
  # required check. Each step fails on deprecations as well as errors, so anything
  # 8.6 objects to turns this job red. Drop continue-on-error once the host offers
  # 8.6 and the site is moving to it. Checklist: docs/operations/php-8.6.md.
  php-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Until 8.6.0 ships, '8.6' installs a nightly from php-src's PHP-8.6 branch.
      # intl is in the default extension set; Name_Match's accent folding needs it.
      - name: Setup PHP 8.6 and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=-1, display_errors=1

      # config.platform.php is pinned to 8.5, so this resolves exactly as lint-test
      # does. check-platform-reqs then asks whether the locked packages accept the
      # real 8.6 runtime: a dependency whose `php` constraint rejects 8.6 is a finding.
      - name: Composer install (root only, PHP tooling)
        run: composer install --no-interaction --no-progress

      - name: Locked dependencies accept PHP 8.6
        run: |
          composer check-platform-reqs --lock --no-interaction
          composer check-platform-reqs --lock --no-interaction --working-dir=plugins/lwtv-plugin

      # Every tracked PHP file, bundled third-party code included (ICal, shadow-taxonomy):
      # those are excluded from PHPCS and PHPStan, so this is the only check that reads
      # them. Compile-time deprecations print here too, and fail the step.
      - name: php -l (parse errors and compile-time deprecations)
        run: |
          git ls-files -z -- '*.php' ':!:vendor/**' ':!:**/vendor/**' ':!:**/node_modules/**' ':!:**/blocks/build/**' \
            | xargs -0 -n 50 -P 4 php -l > php-lint.txt 2>&1 || true
          if grep -vE '^No syntax errors detected in ' php-lint.txt; then
            echo "::error::PHP 8.6 reported the lines above."
            exit 1
          fi
          echo "$(wc -l < php-lint.txt) files parse cleanly on $(php -r 'echo PHP_VERSION;')."

      - name: PHPUnit (fails on deprecations, warnings and notices)
        run: >-
          vendor/bin/phpunit
          --display-deprecations --display-phpunit-deprecations
          --display-warnings --display-notices --display-errors
          --fail-on-deprecation --fail-on-phpunit-deprecation
          --fail-on-warning --fail-on-notice

      # Same rules and baseline as lint-test, analysed as PHP 8.6.
      - name: PHPStan as PHP 8.6
        run: composer analyse:php86 -- --no-progress --error-format=github

  # Runs no PR code: only the scanners, over the PR's files as data.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      # --locked audits composer.lock without installing anything; --no-plugins and
      # --no-scripts keep composer from running any code the PR ships.
      # --abandoned=report: an abandoned package is worth knowing about, not a red build.
      - name: composer audit
        run: |
          composer audit --locked --no-plugins --no-scripts --abandoned=report
          composer audit --locked --no-plugins --no-scripts --abandoned=report --working-dir=plugins/lwtv-plugin

      # The root lockfile covers both workspaces. --package-lock-only reads the lockfile
      # and installs nothing. Runtime dependencies only, and only high/critical, so a
      # moderate advisory deep in webpack tooling doesn't block a merge; OSV-Scanner
      # still reports those on the weekly scan.
      - name: npm audit
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      # CLI, not gitleaks-action: the action needs a paid license on organisation repos.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      # Scan only the commits this PR (or push) adds, not all of history.
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: gitleaks git --config .github/gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1 .
