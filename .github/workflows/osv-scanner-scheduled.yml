name: OSV-Scanner

on:
  pull_request:
    branches: [ "production" ]
  merge_group:
    branches: [ "production" ]
  schedule:
    - cron: '26 18 * * 2'
  push:
    branches: [ "production" ]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      # Config lives in .github/; see osv-scanner-pr.yml.
      scan-args: |-
        --config=.github/osv-scanner.toml
        -r
        ./
